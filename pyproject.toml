[project]
name = "funvideo"
version = "1.0.24"
description = "funvideo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "edge-tts~=6.1.10", "faster-whisper>=1.1.0", "funai>=1.0.1", "funtalk>=1.0.11", "moviepy>=2.0.0", "openai>=1.54.5", "fastapi>=0.110.0", "uvicorn>=0.30.0", "toml>=0.10.2", "funmaterial>=1.0.0", "redis>=5.0.0", "python-multipart>=0.0.9", "cryptography>=50.0.1",]
[[project.authors]]
name = "niuliangtao"
email = "farfarfun@qq.com"

[tool.setuptools]
license-files = []

[dependency-groups]
dev = [ "pytest>=8.0.0", "httpx>=0.27.0",]

# moviepy 2.2.1 声明 pillow<12.0，但截至本次修复所有 Pillow open CVE 都要求
# 12.1.1/12.2.0/12.3.0 才修复。手动验证过 moviepy 的 resize/TextClip 渲染路径
# 在 Pillow 12.3.0 下工作正常，故用 override 打破这个过于保守的上限。
# 见 farfarfun/todo-list#275。
[tool.uv]
override-dependencies = ["pillow>=12.3.0"]
